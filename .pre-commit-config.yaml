repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        files: >-
          ^qgis_vector_map/(algorithms/vectorize_image_algorithm|background|plugin|provider|core/raster|engines/base|engines/classic)\.py$
      - id: ruff-format
        files: >-
          ^qgis_vector_map/(algorithms/vectorize_image_algorithm|background|plugin|provider|core/raster|engines/base|engines/classic)\.py$

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright
        additional_dependencies:
          - qgis-stubs==0.2.0.post1
          - PyQt5-stubs>=5.14
        args:
          - --project
          - pyproject.toml
        pass_filenames: false
        stages:
          - pre-push
